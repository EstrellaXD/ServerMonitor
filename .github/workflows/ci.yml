name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Resolve modules
        working-directory: backend/
        run: go mod download || go mod tidy

      - name: Vet
        working-directory: backend/
        run: go vet ./...

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Resolve modules
        working-directory: backend/
        run: go mod download || go mod tidy

      - name: Run tests
        working-directory: backend/
        run: go test -race -count=1 ./...

  build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Resolve modules
        working-directory: backend/
        run: go mod download || go mod tidy

      - name: Build
        working-directory: backend/
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o server-monitor ./cmd/server-monitor
