name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build aarch64 Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Resolve modules
        working-directory: backend/
        run: go mod download || go mod tidy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend/
        run: npm ci && npm run build

      - name: Build backend (aarch64 static binary)
        working-directory: backend/
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w" -o server-monitor ./cmd/server-monitor

      - name: Package release artifact
        run: |
          mkdir -p release/static
          cp backend/server-monitor release/
          cp -r frontend/dist/* release/static/
          tar -czf server-monitor-aarch64-linux.tar.gz -C release .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: server-monitor-aarch64-linux.tar.gz
          generate_release_notes: true
